name: Build Fabric Mod (MC 1.21.1)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # build-log を push するために必要

    steps:
      # ── 1. ソースチェックアウト ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git push 用に履歴を取得

      # ── 2. Java セットアップ (MC 1.21.1 → Java 21) ─────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # ── 3. Gradle キャッシュ ────────────────────────────────────
      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 4. gradlew に実行権限を付与 ─────────────────────────────
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # ── 5. ビルド実行 & ログ取得 ────────────────────────────────
      #    続行フラグ (continue-on-error: false) はデフォルトなので省略
      #    ビルド結果 (成功/失敗) を outcome で後続 step が参照する
      - name: Build with Gradle
        id: build
        run: |
          ./gradlew build --stacktrace 2>&1 | tee build-log.txt
          # パイプを使うと gradlew の終了コードが失われるため PIPESTATUS で明示的にチェック
          exit "${PIPESTATUS[0]}"
        continue-on-error: true   # 失敗してもログ upload step へ進む

      # ── 6. ビルド成功時 → jar を Artifact としてアップロード ────
      - name: Upload mod JAR
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: warn

      # ── 7. 常に → build-log を Artifact としてアップロード ──────
      #    (成功・失敗どちらでも確認できるよう always() で実行)
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-log.txt
          if-no-files-found: warn

      # ── 8. ビルド失敗時 → build-log を Git に push ───────────────
      - name: Push build-log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p build-logs
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          LOG_FILE="build-logs/build-log_run${{ github.run_number }}_${TIMESTAMP}.txt"

          cp build-log.txt "${LOG_FILE}"

          git add "${LOG_FILE}"
          git commit -m "ci: add build-log for failed run #${{ github.run_number }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      # ── 9. ビルド失敗を最終的にワークフロー失敗として伝播 ───────
      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Build failed. See build-log artifact or build-logs/ directory."
          exit 1
