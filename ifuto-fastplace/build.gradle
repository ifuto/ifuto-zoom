plugins {
	// 1.21.11 は難読化ありのバージョンなので Loom は "-remap" 側を使う
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Terraformers'
		url = uri('https://maven.terraformersmc.com/releases/')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// 設定画面の登録にだけ使う。Mod Menu 側の依存は要らないので transitive は切る
	modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
}

processResources {
	def modVersion = project.version
	inputs.property 'version', modVersion

	filesMatching('fabric.mod.json') {
		expand 'version': modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.base.archivesName.get()

	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}
}

// タイミングモデルの自己テスト（CI で毎回。壊れていたら落とす）
tasks.register('testFastplace', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.ifuto.fastplace.test.ClickModelSelfTest'
}

// Scaffold の人間モデル（視線・設置リズム・距離トリガの安全性）の自己テスト
tasks.register('testScaffold', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.ifuto.fastplace.test.ScaffoldModelSelfTest'
}

// Aim Assist の人間モデル（反応時間・速度上限・当たり判定に収まるか）の自己テスト
tasks.register('testAim', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.ifuto.fastplace.test.AimAssistSelfTest'
}

check.dependsOn testFastplace, testScaffold, testAim

// mixins.json が参照するクラスが実際にビルドされているか検証する（起動時クラッシュ防止）
tasks.register('verifyMixinConfigs') {
	dependsOn tasks.named('classes')
	doLast {
		def classesDirs = sourceSets.main.output.classesDirs.files
		def resourcesDir = sourceSets.main.output.resourcesDir
		def failures = []
		fileTree('src/main/resources').matching { include '**/*.mixins.json' }.each { f ->
			def json = new groovy.json.JsonSlurper().parse(f)
			def pkg = (json.package as String).replace('.', '/')
			['mixins', 'client', 'server'].each { key ->
				(json[key] ?: []).each { name ->
					def rel = "${pkg}/${name}.class"
					def found = classesDirs.any { new File(it, rel).exists() }
							|| new File(resourcesDir, rel).exists()
					if (!found) {
						failures << "${f.name}: class not built: ${json.package}.${name}"
					}
				}
			}
		}
		if (!failures.isEmpty()) {
			throw new GradleException("mixin config entries without classes:\n" + failures.join('\n'))
		}
		println 'verifyMixinConfigs: all mixin classes present'
	}
}

check.dependsOn verifyMixinConfigs
