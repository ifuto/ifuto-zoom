plugins {
	// 1.21.11 は難読化ありのバージョンなので Loom は "-remap" 側を使う
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	def modVersion = project.version
	inputs.property 'version', modVersion

	filesMatching('fabric.mod.json') {
		expand 'version': modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.base.archivesName.get()

	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}
}

// パイプライン制御（AIMD・EWMA・優先度）の自己テスト（CI で毎回。壊れていたら落とす）
tasks.register('testFastgenerate', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.ifuto.fastgenerate.test.FastGenerateSelfTest'
}

check.dependsOn testFastgenerate
